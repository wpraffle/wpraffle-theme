    <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e4678a"/><stop offset="100%" stop-color="#5caeed"/>
    </linearGradient>
    <filter id="frameShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardImg1" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0%" stop-color="#e4678a"/><stop offset="100%" stop-color="#7a3a52"/></linearGradient>
