    <linearGradient id="heroOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#1a1a1a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="heroImg" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#3a1f4a"/><stop offset="45%" stop-color="#2c2c2c"/><stop offset="100%" stop-color="#4a3a2a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e4678a"/><stop offset="100%" stop-color="#5caeed"/>
